,\"schritte\":[{\"nr\":1,\"art\":\"schritt\",\"titel\":\"Was eine Potenz eigentlich ist\",\"raten\":\"\u003cp\u003eWas bedeutet 2⁴ ausgeschrieben?\u003c/p\u003e\",\"was\":\"$11\",\"formel\":null,\"warum\":\"\u003cp\u003eAlle Potenzgesetze kannst du dir selbst herleiten, wenn du die Potenz einfach ausschreibst. Du musst sie also nicht auswendig lernen, du musst nur zählen.\u003c/p\u003e\",\"bild\":null,\"hinweise\":[],\"loesung\":null},{\"nr\":2,\"art\":\"schritt\",\"titel\":\"Gesetz 1 und 2: malnehmen und teilen\",\"raten\":\"\u003cp\u003eWie viele Zweien stehen in 2³ · 2² insgesamt?\u003c/p\u003e\",\"was\":\"\u003cp\u003eBei \u003cstrong\u003egleicher Basis\u003c/strong\u003e werden beim Malnehmen die Hochzahlen \u003cstrong\u003eaddiert\u003c/strong\u003e, beim Teilen \u003cstrong\u003eabgezogen\u003c/strong\u003e:\u003c/p\u003e\",\"formel\":\"$12\",\"warum\":\"\u003cp\u003eBeim Malnehmen hängst du die Zweien einfach hintereinander: 3 + 2 = 5 Stück. Beim Teilen kürzen sich so viele weg, wie unten stehen: 5 − 2 = 3 bleiben übrig.\u003c/p\u003e\",\"bild\":null,\"hinweise\":[],\"loesung\":null},{\"nr\":3,\"art\":\"schritt\",\"titel\":\"Gesetz 3: Potenz hoch Potenz\",\"raten\":\"\u003cp\u003eWas ist (x²)³ — wie viele x stehen da am Ende?\u003c/p\u003e\",\"was\":\"\u003cp\u003eSteht eine Potenz nochmal hoch etwas, werden die Hochzahlen \u003cstrong\u003emalgenommen\u003c/strong\u003e:\u003c/p\u003e\",\"formel\":\"$13\",\"warum\":\"\u003cp\u003e„Hoch 3“ heißt: das Ganze dreimal hinschreiben. Dreimal zwei x sind sechs x.\u003c/p\u003e\",\"bild\":null,\"hinweise\":[],\"loesung\":null},{\"nr\":4,\"art\":\"schritt\",\"titel\":\"Gesetz 4 und 5: gleiche Hochzahl\",\"raten\":null,\"was\":\"\u003cp\u003eHaben zwei Potenzen die \u003cstrong\u003egleiche Hochzahl\u003c/strong\u003e, darf man die Basen zusammenfassen:\u003c/p\u003e\",\"formel\":\"$14\",\"warum\":\"$15\",\"bild\":null,\"hinweise\":[],\"loesung\":null},{\"nr\":5,\"art\":\"schritt\",\"titel\":\"Gesetz 6: negative Hochzahl und hoch 0\",\"raten\":\"\u003cp\u003eWas kommt raus, wenn du 2³ durch 2³ teilst — einmal mit dem Gesetz, einmal normal?\u003c/p\u003e\",\"was\":\"$16\",\"formel\":\"$17\",\"warum\":\"$18\",\"bild\":null,\"hinweise\":[],\"loesung\":null},{\"nr\":6,\"art\":\"schritt\",\"titel\":\"Wurzel ist auch eine Potenz\",\"raten\":null,\"was\":\"\u003cp\u003eDie Wurzel schreibst du als Hochzahl ein Halb:\u003c/p\u003e\",\"formel\":\"$19\",\"warum\":\"$1a\",\"bild\":null,\"hinweise\":[],\"loesung\":null},{\"nr\":7,\"art\":\"schritt\",\"titel\":\"Brüche malnehmen: oben mal oben, unten mal unten\",\"raten\":\"\u003cp\u003eWas ist die Hälfte von einem Drittel?\u003c/p\u003e\",\"was\":\"\u003cp\u003eBeim Malnehmen rechnest du \u003cstrong\u003eZähler mal Zähler\u003c/strong\u003e und \u003cstrong\u003eNenner mal Nenner\u003c/strong\u003e. Einen gemeinsamen Nenner brauchst du hier \u003cstrong\u003enicht\u003c/strong\u003e.\u003c/p\u003e\",\"formel\":\"$1b\",\"warum\":\"$1c\",\"bild\":null,\"hinweise\":[],\"loesung\":null},{\"nr\":8,\"art\":\"schritt\",\"titel\":\"Brüche teilen: mit dem Kehrwert malnehmen\",\"raten\":\"\u003cp\u003eWie oft passt ½ in 3?\u003c/p\u003e\",\"was\":\"\u003cp\u003eBeim Teilen drehst du den \u003cstrong\u003ezweiten\u003c/strong\u003e Bruch (den hinter dem Doppelpunkt) um, also Zähler und Nenner tauschen, und rechnest dann \u003cstrong\u003emal\u003c/strong\u003e. Den ersten Bruch lässt du so, wie er ist.\u003c/p\u003e\",\"formel\":\"$1d\",\"warum\":\"$1e\",\"bild\":null,\"hinweise\":[],\"loesung\":null},{\"nr\":9,\"art\":\"schritt\",\"titel\":\"Brüche plus und minus: erst gleicher Nenner\",\"raten\":\"\u003cp\u003eWarum darf man 1 Viertel und 5 Achtzehntel nicht einfach so zusammenzählen?\u003c/p\u003e\",\"was\":\"\u003cp\u003eZuerst machst du die Nenner gleich (\u003cstrong\u003eHauptnenner\u003c/strong\u003e, das ist das kgV der Nenner). Dann rechnest du \u003cstrong\u003enur die Zähler\u003c/strong\u003e und der Nenner bleibt stehen.\u003c/p\u003e\",\"formel\":\"$1f\",\"warum\":\"$20\",\"bild\":null,\"hinweise\":[],\"loesung\":null},{\"nr\":10,\"art\":\"schritt\",\"titel\":\"Doppelbruch knacken (wie auf deinem Arbeitsblatt)\",\"raten\":\"\u003cp\u003eWie würdest du den Bruch unten in einen normalen Bruch verwandeln?\u003c/p\u003e\",\"was\":\"\u003cp\u003eEin Doppelbruch ist einfach „Bruch geteilt durch Bruch“. Beispiel vom Arbeitsblatt:\u003c/p\u003e\",\"formel\":\"$21\",\"warum\":\"$22\",\"bild\":null,\"hinweise\":[],\"loesung\":null},{\"nr\":11,\"art\":\"schritt\",\"titel\":\"Drei Stockwerke: Zähler, Nenner und noch ein Nenner\",\"raten\":\"\u003cp\u003eWenn drei Zahlen untereinander stehen: Woran erkennst du, welcher der beiden Bruchstriche der wichtige ist?\u003c/p\u003e\",\"was\":\"\u003cp\u003eStehen drei Dinge untereinander, gibt es \u003cstrong\u003ezwei Bruchstriche\u003c/strong\u003e. Zuerst suchst du den \u003cstrong\u003eHauptstrich\u003c/strong\u003e: Das ist der Strich auf Höhe des Gleichheitszeichens (der längere). Alles darüber ist der Zähler, alles darunter der Nenner. Dann gibt es zwei Fälle: \u003cstrong\u003eFall A:\u003c/strong\u003e zwei Stockwerke stehen unten, \u003cstrong\u003eFall B:\u003c/strong\u003e zwei Stockwerke stehen oben.\u003c/p\u003e\",\"formel\":\"$23\",\"warum\":\"$24\",\"bild\":null,\"hinweise\":[],\"loesung\":null},{\"nr\":12,\"art\":\"schritt\",\"titel\":\"Warum nicht immer Fall A? Dieselben Zahlen, anderes Ergebnis\",\"raten\":\"\u003cp\u003eNimm die Zahlen 2, 3 und 4. Was ist größer: 2 geteilt durch ¾ oder ⅔ geteilt durch 4? Schätze erst, ohne zu rechnen.\u003c/p\u003e\",\"was\":\"\u003cp\u003eFall A und Fall B sind \u003cstrong\u003ekeine zwei verschiedenen Regeln\u003c/strong\u003e. Es ist immer dieselbe: \u003cstrong\u003eAlles unter dem Hauptstrich wird umgedreht (Kehrwert) und dann malgenommen.\u003c/strong\u003e Dass es nach zwei Fällen aussieht, liegt nur daran, dass der Hauptstrich mal vor der einzelnen Zahl und mal vor dem Bruch steht. Siehst du es? Gleiche Zahlen, nur der Hauptstrich sitzt woanders:\u003c/p\u003e\",\"formel\":\"$25\",\"warum\":\"$26\",\"bild\":null,\"hinweise\":[],\"loesung\":null},{\"nr\":13,\"art\":\"jetzt_du\",\"titel\":\"Bruch-Mix\",\"raten\":null,\"was\":\"$27\",\"formel\":null,\"warum\":null,\"bild\":null,\"hinweise\":[\"\u003cp\u003ea) Kürze erst über Kreuz: 5 mit 10, 6 mit 9.\u003c/p\u003e\",\"\u003cp\u003eb) Nur den zweiten Bruch umdrehen, dann mal.\u003c/p\u003e\",\"\u003cp\u003ec) Hauptnenner: das kgV von 6 und 4. Dann erweitern und nur die Zähler addieren.\u003c/p\u003e\"],\"loesung\":\"$28\"},{\"nr\":14,\"art\":\"jetzt_du\",\"titel\":\"Vereinfache (Arbeitsblatt, Aufgabe 2)\",\"raten\":null,\"was\":\"$29\",\"formel\":null,\"warum\":null,\"bild\":null,\"hinweise\":[\"\u003cp\u003eOben und unten getrennt: Hochzahlen zusammenzählen.\u003c/p\u003e\",\"$2a\",\"\u003cp\u003eDann Gesetz 2: oben minus unten.\u003c/p\u003e\"],\"loesung\":\"$2b\"},{\"nr\":15,\"art\":\"jetzt_du\",\"titel\":\"Negative Hochzahl\",\"raten\":null,\"was\":\"$2c\",\"formel\":null,\"warum\":null,\"bild\":null,\"hinweise\":[\"\u003cp\u003eGleiche Basen zusammen: erst alle 4er, dann alle 5er.\u003c/p\u003e\",\"$2d\"],\"loesung\":\"$2e\"},{\"nr\":16,\"art\":\"jetzt_du\",\"titel\":\"Drei Stockwerke\",\"raten\":null,\"was\":\"$2f\",\"formel\":null,\"warum\":null,\"bild\":null,\"hinweise\":[\"\u003cp\u003eSuch zuerst den Hauptstrich: Was steht ganz oben, was ganz unten?\u003c/p\u003e\",\"$30\",\"\u003cp\u003eDann: Kehrwert vom unteren Bruch nehmen und malrechnen. Vor dem Ausrechnen kürzen.\u003c/p\u003e\"],\"loesung\":\"$31\"}],\"zusammenfassung\":[{\"was\":\"\u003cp\u003e\u003cstrong\u003eGleiche Basis, malnehmen:\u003c/strong\u003e Hochzahlen addieren. \u003cstrong\u003eTeilen:\u003c/strong\u003e Hochzahlen abziehen.\u003c/p\u003e\",\"formel\":\"$32\"},{\"was\":\"\u003cp\u003e\u003cstrong\u003ePotenz hoch Potenz:\u003c/strong\u003e Hochzahlen malnehmen.\u003c/p\u003e\",\"formel\":\"$33\"},{\"was\":\"\u003cp\u003e\u003cstrong\u003eMinus in der Hochzahl\u003c/strong\u003e heißt „ab in den Nenner“, und \u003cstrong\u003ehoch 0 ist immer 1\u003c/strong\u003e.\u003c/p\u003e\",\"formel\":\"$34\"},{\"was\":\"\u003cp\u003e\u003cstrong\u003eWurzel ist hoch ein Halb.\u003c/strong\u003e Damit kann man Wurzeln wie Potenzen ableiten.\u003c/p\u003e\",\"formel\":\"$35\"},{\"was\":\"\u003cp\u003e\u003cstrong\u003eBrüche malnehmen:\u003c/strong\u003e oben mal oben, unten mal unten. \u003cstrong\u003ePlus/Minus:\u003c/strong\u003e erst gleicher Nenner, dann nur die Zähler rechnen. Nenner nie addieren!\u003c/p\u003e\",\"formel\":\"$36\"},{\"was\":\"\u003cp\u003e\u003cstrong\u003eDurch einen Bruch teilen = mit dem Kehrwert malnehmen.\u003c/strong\u003e So knackst du jeden Doppelbruch.\u003c/p\u003e\",\"formel\":\"$37\"},{\"was\":\"\u003cp\u003e\u003cstrong\u003eDrei Stockwerke:\u003c/strong\u003e Erst den Hauptstrich suchen, die einzelne Zahl als Bruch schreiben (mit 1 darunter), dann Kehrwert vom Unteren und mal. Es ist immer dieselbe Regel, nur der Hauptstrich sitzt mal woanders.\u003c/p\u003e\",\"formel\":\"$38\"}],\"zusaetze\":[],\"legende\":[],\"naechste\":{\"schluessel\":\"ma-ggt-kgv\",\"titel\":\"ggT und kgV — und wofür man sie braucht\"}},\"farbe\":\"hsl(235 55% 55%)\",\"geteilt\":true}]]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#161109\"}]]\n8:null\nd:[[\"$\",\"title\",\"0\",{\"children\":\"Lernen — geteilt\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Erklärungen und Formelsammlung\"}],[\"$\",\"meta\",\"2\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"link\",\"3\",{\"rel\":\"icon\",\"href\":\"/LK-Enterbt/icon.svg\"}],[\"$\",\"$L39\",\"4\",{}]]\n"])</script></body></html>
