tes gemeinsames Vielfaches für Hauptnenner und Gauß.\"}],[\"$\",\"p\",null,{\"className\":\"mt-1 text-[13px] text-[var(--ink-faint)]\",\"children\":[9,\" Schritte\",\", dann bist du dran\"]}]]}],[\"$\",\"$L10\",null,{\"e\":{\"schluessel\":\"ma-ggt-kgv\",\"titel\":\"ggT und kgV — und wofür man sie braucht\",\"kurz\":\"Größter gemeinsamer Teiler zum Kürzen, kleinstes gemeinsames Vielfaches für Hauptnenner und Gauß.\",\"quelle\":\"Heft Mathe, S. 23 (Nebenrechnung beim Gauß-Verfahren, 01.10.2026); Lerngespräch 05.10.2026\",\"fach\":\"Mathe\",\"themaSchluessel\":\"ma-bruch-potenz\",\"themaTitel\":\"Bruch- und Potenzrechnung\",\"anzahlSchritte\":9,\"durchgearbeitetAm\":null,\"taschenrechner\":false,\"schritte\":[{\"nr\":1,\"art\":\"schritt\",\"titel\":\"Zahlen in Bausteine zerlegen\",\"raten\":\"\u003cp\u003eAus welchen Primzahlen ist 18 zusammengesetzt?\u003c/p\u003e\",\"was\":\"\u003cp\u003eJede Zahl lässt sich in \u003cstrong\u003ePrimzahlen\u003c/strong\u003e zerlegen (Zahlen, die nur durch 1 und sich selbst teilbar sind: 2, 3, 5, 7, 11 …):\u003c/p\u003e\",\"formel\":\"$11\",\"warum\":\"$12\",\"bild\":null,\"hinweise\":[],\"loesung\":null},{\"nr\":2,\"art\":\"schritt\",\"titel\":\"ggT: was beide gemeinsam haben\",\"raten\":null,\"was\":\"\u003cp\u003eDer \u003cstrong\u003egrößte gemeinsame Teiler\u003c/strong\u003e besteht aus den Bausteinen, die in \u003cstrong\u003ebeiden\u003c/strong\u003e Zahlen vorkommen. 4 hat zwei Zweien, 18 hat eine Zwei, gemeinsam ist also \u003cstrong\u003eeine\u003c/strong\u003e Zwei:\u003c/p\u003e\",\"formel\":\"$13\",\"warum\":\"$14\",\"bild\":null,\"hinweise\":[],\"loesung\":null},{\"nr\":3,\"art\":\"schritt\",\"titel\":\"kgV: die kleinste Zahl, in die beide passen\",\"raten\":\"\u003cp\u003eZähl die Vielfachen von 18 hoch: 18, 36, … — in welche passt die 4 zum ersten Mal?\u003c/p\u003e\",\"was\":\"\u003cp\u003eFür das \u003cstrong\u003ekleinste gemeinsame Vielfache\u003c/strong\u003e nimmst du jeden Baustein \u003cstrong\u003eso oft, wie er höchstens\u003c/strong\u003e in einer der Zahlen vorkommt. Die Zwei kommt höchstens zweimal vor (in der 4), die Drei höchstens zweimal (in der 18):\u003c/p\u003e\",\"formel\":\"$15\",\"warum\":\"\u003cp\u003e36 ist durch 4 teilbar (9-mal) und durch 18 (2-mal). Eine kleinere Zahl mit dieser Eigenschaft gibt es nicht. Bei kleinen Zahlen geht es auch durch Hochzählen: 18, \u003cstrong\u003e36\u003c/strong\u003e ← da passt die 4 rein.\u003c/p\u003e\",\"bild\":null,\"hinweise\":[],\"loesung\":null},{\"nr\":4,\"art\":\"schritt\",\"titel\":\"Der Abkürzungs-Trick fürs kgV\",\"raten\":\"\u003cp\u003eWenn ggT(4; 18) = 2 ist: Wie bekommst du aus 4 · 18 = 72 das kgV?\u003c/p\u003e\",\"was\":\"$16\",\"formel\":\"$17\",\"warum\":\"$18\",\"bild\":null,\"hinweise\":[],\"loesung\":null},{\"nr\":5,\"art\":\"schritt\",\"titel\":\"Der Rest-Trick für den ggT: so geht's\",\"raten\":\"\u003cp\u003eWelchen Rest lässt 18 geteilt durch 4?\u003c/p\u003e\",\"was\":\"\u003cp\u003eDen ggT findest du auch \u003cstrong\u003eohne Zerlegen\u003c/strong\u003e, nur mit Teilen mit Rest. So geht's:\u003cbr\u003e\u003cstrong\u003e1.\u003c/strong\u003e Teile die größere Zahl durch die kleinere. Schreib auf, wie oft sie passt \u003cstrong\u003eund was übrig bleibt\u003c/strong\u003e (der Rest).\u003cbr\u003e\u003cstrong\u003e2.\u003c/strong\u003e Mach mit zwei neuen Zahlen weiter: die \u003cstrong\u003ekleinere Zahl\u003c/strong\u003e wird zur neuen großen, der \u003cstrong\u003eRest\u003c/strong\u003e zur neuen kleinen. Wieder teilen mit Rest.\u003cbr\u003e\u003cstrong\u003e3.\u003c/strong\u003e Wiederhole das, bis der Rest \u003cstrong\u003e0\u003c/strong\u003e ist. Der \u003cstrong\u003eletzte Rest, der nicht 0 war\u003c/strong\u003e, ist der ggT.\u003c/p\u003e\",\"formel\":\"$19\",\"warum\":\"$1a\",\"bild\":null,\"hinweise\":[],\"loesung\":null},{\"nr\":6,\"art\":\"schritt\",\"titel\":\"Warum der Rest-Trick stimmt\",\"raten\":\"\u003cp\u003eEine Zahl geht in 18 und in 4 auf. Geht sie dann auch in 2 auf?\u003c/p\u003e\",\"was\":\"\u003cp\u003eDer Trick funktioniert, weil das Paar (18; 4) und das Paar (4; 2) \u003cstrong\u003egenau dieselben gemeinsamen Teiler\u003c/strong\u003e haben. Darum ist auch der ggT derselbe, aber die Zahlen sind kleiner und damit leichter.\u003c/p\u003e\",\"formel\":\"$1b\",\"warum\":\"$1c\",\"bild\":null,\"hinweise\":[],\"loesung\":null},{\"nr\":7,\"art\":\"schritt\",\"titel\":\"Rest-Trick mit mehreren Runden\",\"raten\":\"\u003cp\u003e252 durch 105: wie oft passt die 105 hinein, und welcher Rest bleibt?\u003c/p\u003e\",\"was\":\"$1d\",\"formel\":\"$1e\",\"warum\":\"$1f\",\"bild\":null,\"hinweise\":[],\"loesung\":null},{\"nr\":8,\"art\":\"schritt\",\"titel\":\"Wofür: Hauptnenner\",\"raten\":null,\"was\":\"\u003cp\u003eBeim Addieren von Brüchen ist das kgV der Nenner der \u003cstrong\u003ekleinste gemeinsame Nenner\u003c/strong\u003e:\u003c/p\u003e\",\"formel\":\"$20\",\"warum\":\"$21\",\"bild\":null,\"hinweise\":[],\"loesung\":null},{\"nr\":9,\"art\":\"schritt\",\"titel\":\"Wofür: Gauß-Verfahren (deine Tafel!)\",\"raten\":null,\"was\":\"$22\",\"formel\":\"$23\",\"warum\":\"\u003cp\u003eDarum stand das kgV auf deiner Gauß-Seite. Mit dem kgV bleiben die Zahlen klein, und du verrechnest dich weniger. Genau das zeigt die Gauß-Erklärung Schritt für Schritt.\u003c/p\u003e\",\"bild\":null,\"hinweise\":[],\"loesung\":null},{\"nr\":10,\"art\":\"jetzt_du\",\"titel\":\"ggT und kgV von 12 und 30\",\"raten\":null,\"was\":\"$24\",\"formel\":null,\"warum\":null,\"bild\":null,\"hinweise\":[\"$25\",\"\u003cp\u003eGemeinsam: eine 2 und eine 3. Höchstens: zwei 2en, eine 3, eine 5.\u003c/p\u003e\"],\"loesung\":\"$26\"},{\"nr\":11,\"art\":\"jetzt_du\",\"titel\":\"Rest-Trick: 90 und 42\",\"raten\":null,\"was\":\"$27\",\"formel\":null,\"warum\":null,\"bild\":null,\"hinweise\":[\"\u003cp\u003e42 passt zweimal in 90 (\u003cspan class=\\\"katex\\\"\u003e\u003cspan class=\\\"katex-mathml\\\"\u003e\u003cmath xmlns=\\\"http://www.w3.org/1998/Math/MathML\\\"\u00
