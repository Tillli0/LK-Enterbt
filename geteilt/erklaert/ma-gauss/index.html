n\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\\\"katex-html\\\" aria-hidden=\\\"true\\\"\u003e\u003cspan class=\\\"base\\\"\u003e\u003cspan class=\\\"strut\\\" style=\\\"height:0.625em;vertical-align:-0.1944em;\\\"\u003e\u003c/span\u003e\u003cspan class=\\\"mord mathnormal\\\" style=\\\"margin-right:0.0359em;\\\"\u003ey\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e weg. Genau das ist die Idee von Gauß: \u003cstrong\u003eGleichungen so kombinieren, dass Unbekannte verschwinden.\u003c/strong\u003e Bei vier Unbekannten machst du das einfach ordentlich der Reihe nach.\u003c/p\u003e\",\"bild\":null,\"hinweise\":[],\"loesung\":null},{\"nr\":2,\"art\":\"schritt\",\"titel\":\"Was man mit Zeilen machen darf\",\"raten\":null,\"was\":\"\u003cp\u003eDrei Umformungen ändern die Lösung \u003cstrong\u003enicht\u003c/strong\u003e:\u003c/p\u003e\",\"formel\":\"$12\",\"warum\":\"$13\",\"bild\":null,\"hinweise\":[],\"loesung\":null},{\"nr\":3,\"art\":\"schritt\",\"titel\":\"Das Ziel: eine Treppe\",\"raten\":null,\"was\":\"\u003cp\u003eAm Ende soll die Tabelle so aussehen, unten links nur Nullen (\u003cstrong\u003eStufenform\u003c/strong\u003e):\u003c/p\u003e\",\"formel\":\"$14\",\"warum\":\"\u003cp\u003eDann hat die letzte Zeile nur noch \u003cstrong\u003eeine\u003c/strong\u003e Unbekannte, die kannst du sofort ausrechnen. Danach die vorletzte, und so weiter: Du läufst die Treppe hoch.\u003c/p\u003e\",\"bild\":null,\"hinweise\":[],\"loesung\":null},{\"nr\":4,\"art\":\"schritt\",\"titel\":\"Jetzt durchklicken: das System von der Tafel\",\"raten\":null,\"was\":\"\u003cp\u003eDas ist das Steckbrief-System von der Tafel. Klick „Weiter“ und beobachte, welche Zeilen sich ändern und womit gerechnet wurde.\u003c/p\u003e\",\"formel\":null,\"warum\":\"$15\",\"bild\":{\"art\":\"gauss\"},\"hinweise\":[],\"loesung\":null},{\"nr\":5,\"art\":\"schritt\",\"titel\":\"So schreibst du es in der Klausur auf\",\"raten\":null,\"was\":\"\u003cp\u003eNeben jede Zeile schreibst du die Rechnung, so wie an der Tafel mit Pfeilen. Die Kurzschreibweise:\u003c/p\u003e\",\"formel\":\"$16\",\"warum\":\"\u003cp\u003eBeides bedeutet dasselbe. Wichtig ist, dass man sieht, was du gemacht hast. Dann gibt es auch bei einem Rechenfehler noch Punkte für den Weg. Zeile I bleibt immer stehen und wird nur abgeschrieben.\u003c/p\u003e\",\"bild\":null,\"hinweise\":[],\"loesung\":null},{\"nr\":6,\"art\":\"schritt\",\"titel\":\"Rückwärts einsetzen\",\"raten\":null,\"was\":\"\u003cp\u003eAus der Treppe von unten nach oben:\u003c/p\u003e\",\"formel\":\"$17\",\"warum\":\"$18\",\"bild\":null,\"hinweise\":[],\"loesung\":null},{\"nr\":7,\"art\":\"schritt\",\"titel\":\"Wenn es schiefgeht: keine oder unendlich viele Lösungen\",\"raten\":null,\"was\":\"\u003cp\u003eManchmal entsteht eine Zeile nur aus Nullen:\u003c/p\u003e\",\"formel\":\"$19\",\"warum\":\"$1a\",\"bild\":null,\"hinweise\":[],\"loesung\":null},{\"nr\":8,\"art\":\"jetzt_du\",\"titel\":\"Ein 3×3-System\",\"raten\":null,\"was\":\"$1b\",\"formel\":null,\"warum\":null,\"bild\":null,\"hinweise\":[\"$1c\",\"$1d\",\"$1e\"],\"loesung\":\"$1f\"},{\"nr\":9,\"art\":\"jetzt_du\",\"titel\":\"Selbst die Tafelrechnung nachmachen\",\"raten\":null,\"was\":\"\u003cp\u003eMach das Tafelbeispiel ohne Hilfe auf Papier: Starte mit der Tabelle aus der Steckbrief-Erklärung und bring sie in Stufenform. Vergleiche dann mit dem Bild bei „Jetzt durchklicken“.\u003c/p\u003e\",\"formel\":null,\"warum\":null,\"bild\":null,\"hinweise\":[\"\u003cp\u003eErst Spalte a: II − 8·I, III − 27·I, IV − 3·I.\u003c/p\u003e\",\"\u003cp\u003eSpalte b: kgV(4; 18) = 36.\u003c/p\u003e\"],\"loesung\":\"$20\"}],\"zusammenfassung\":[{\"was\":\"\u003cp\u003e\u003cstrong\u003eErlaubt:\u003c/strong\u003e Zeilen tauschen, eine Zeile mit einer Zahl (nicht 0) malnehmen, ein Vielfaches einer Zeile zu einer anderen addieren.\u003c/p\u003e\",\"formel\":null},{\"was\":\"\u003cp\u003e\u003cstrong\u003eZiel: Stufenform\u003c/strong\u003e (Treppe), unten links nur Nullen. Spalte für Spalte von links nach rechts.\u003c/p\u003e\",\"formel\":null},{\"was\":\"\u003cp\u003e\u003cstrong\u003eRückwärts einsetzen:\u003c/strong\u003e unterste Zeile hat nur eine Unbekannte → lösen → in die Zeile darüber einsetzen → …\u003c/p\u003e\",\"formel\":null},{\"was\":\"\u003cp\u003e\u003cstrong\u003eTrick:\u003c/strong\u003e Passen die Zahlen nicht zusammen (−4 und −18), beide aufs \u003cstrong\u003ekgV\u003c/strong\u003e (36) bringen.\u003c/p\u003e\",\"formel\":null},{\"was\":\"$21\",\"formel\":null}],\"zusaetze\":[],\"legende\":[{\"schluessel\":\"matA\",\"zeichen\":\"\u003cspan class=\\\"katex\\\"\u003e\u003cspan class=\\\"katex-mathml\\\"\u003e\u003cmath xmlns=\\\"http://www.w3.org/1998/Math/MathML\\\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eA\u003c/mi\u003e\u003c/mrow\u003e\u003cannotation encoding=\\\"application/x-tex\\\"\u003eA\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\\\"katex-html\\\" aria-hidden=\\\"true\\\"\u003e\u003cspan class=\\\"base\\\"\u003e\u003cspan class=\\\"strut\\\" style=\\\"height:0.6833em;\\\"\u003e\u003c/span\u003e\u003cspan class=\\\"mord mathnormal\\\"\u003eA\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\",\"name\":\"Koeffizientenmatrix\",\"bedeutung\":\"Die Zahlen vor den Unbekannten, als Tabelle. Beim LGS: A·x⃗ = y⃗.\",\"einheit\":\"\"},{\"schluessel\":\"vecX\",\"zeichen\":\"\u003cspan class=\\\"katex-error\\\" title=\\\"ParseError: KaTeX parse error: Unexpected character: \u0026#x27;\\u000b\u0026#x27; at position 1: \\u000b̲ec{x}\\\" style=\\\"color:#cc0000\\\"\u003e\\u000bec{x}\u003c/span\u003e\",\"name\":\"Lösungsvektor\",\"bedeutung\":\"Die gesuchten Unbekannten untereinander in einer Klammer, z. B. a, b, c, d.\",\"einheit\":\"\"},{\"schluessel\":\"kgV\",\"zeichen\":\"\u003cspan class=\\\"katex\\\"\u003e\u003cspan class=\\\"katex-mathml\\\"\u003e\u003cmath xmlns=\\\"http://www.w3.org/1998/Math/MathML\
